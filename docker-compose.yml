services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MAX_CLAIM_TRANSCRIPT_CHARS: ${MAX_CLAIM_TRANSCRIPT_CHARS:-100000}
      STORAGE_ROOT: /srv/storage
      MODEL_CACHE: /srv/storage/models
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-base}
      TRANSCRIPTION_MODEL_REVISION: ${TRANSCRIPTION_MODEL_REVISION:-main}
      TRANSCRIPTION_TIMEOUT_SECONDS: ${TRANSCRIPTION_TIMEOUT_SECONDS:-900}
      TRANSCRIPTION_THREADS: ${TRANSCRIPTION_THREADS:-4}
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-104857600}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-600}
      PROCESS_TIMEOUT_SECONDS: ${PROCESS_TIMEOUT_SECONDS:-120}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-2}
    volumes:
      - media:/srv/storage
volumes:
  media:
