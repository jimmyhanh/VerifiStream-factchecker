[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verifistream"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]
[project.optional-dependencies]
transcription = ["faster-whisper==1.2.1", "av==16.1.0"]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real FFmpeg and FFprobe", "asr: opt-in real model inference"]
