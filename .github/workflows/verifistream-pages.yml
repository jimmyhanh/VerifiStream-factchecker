name: Publish VerifiStream Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['github-pages/**', 'frontend/**', '.github/workflows/verifistream-pages.yml']
permissions:
  contents: read
concurrency:
  group: verifistream-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v5
      - run: bash github-pages/build.sh
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.PAGES_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
