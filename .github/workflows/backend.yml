name: Backend tests
on:
  push:
    branches: [main, milestone-1-video-ingestion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run all tests including real media integration
        working-directory: backend
        run: python -m pytest -q --junitxml=test-results.xml
      - name: HTTP server smoke test
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
