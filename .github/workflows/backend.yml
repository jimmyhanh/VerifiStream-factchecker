name: Backend tests
on:
  push:
    branches: [main, milestone-1-video-ingestion, milestone-2-transcription, milestone-3-claim-detection]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[dev,transcription]'
      - name: Download public speech smoke fixture
        run: curl -L --fail --retry 3 -o /tmp/jfk.wav https://raw.githubusercontent.com/ggerganov/whisper.cpp/master/samples/jfk.wav
      - name: Run all tests including real media integration
        working-directory: backend
        env:
          ASR_TEST_AUDIO: /tmp/jfk.wav
          HF_HUB_DISABLE_XET: '1'
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Claim extraction evaluation
        run: python evaluation/claims/evaluate.py --output /tmp/claim-evaluation.json
      - name: Save claim evaluation
        uses: actions/upload-artifact@v4
        with:
          name: claim-evaluation
          path: /tmp/claim-evaluation.json
      - name: HTTP server smoke test
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and start development container
        run: docker compose up --build -d
      - name: Check health and real upload through container
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health
          docker compose exec -T backend ffmpeg -nostdin -y -v error -f lavfi -i color=c=blue:s=64x64:r=10:d=1 -f lavfi -i sine=frequency=440:duration=1 -c:v mpeg4 -c:a aac -shortest /tmp/sample.mp4
          docker compose cp backend:/tmp/sample.mp4 /tmp/verifistream-sample.mp4
          curl --fail -F "file=@/tmp/verifistream-sample.mp4;type=video/mp4" http://127.0.0.1:8000/videos > /tmp/verifistream-response.json
          python -c 'import json; r=json.load(open("/tmp/verifistream-response.json")); assert r["status"]=="completed", r'
      - name: Real speech through container transcription API
        run: |
          curl -L --fail --retry 3 -o /tmp/jfk.wav https://raw.githubusercontent.com/ggerganov/whisper.cpp/master/samples/jfk.wav
          docker compose cp /tmp/jfk.wav backend:/tmp/jfk.wav
          docker compose exec -T backend ffmpeg -nostdin -y -v error -f lavfi -i color=c=blue:s=64x64:r=10 -i /tmp/jfk.wav -c:v mpeg4 -c:a aac -shortest /tmp/speech.mp4
          docker compose cp backend:/tmp/speech.mp4 /tmp/speech.mp4
          curl --fail -F "file=@/tmp/speech.mp4;type=video/mp4" http://localhost:8000/videos > /tmp/video.json
          VIDEO_ID=$(python -c 'import json; print(json.load(open("/tmp/video.json"))["id"])')
          curl --fail --max-time 900 -H 'Content-Type: application/json' -d '{"language":"en"}' "http://localhost:8000/videos/$VIDEO_ID/transcriptions" > /tmp/transcript.json
          python -c 'import json; r=json.load(open("/tmp/transcript.json")); assert r["status"]=="completed", r; assert "country" in r["text"].lower(), r'
      - name: Claim extraction from real container transcript
        run: |
          VIDEO_ID=$(python -c 'import json; print(json.load(open("/tmp/video.json"))["id"])')
          curl --fail --max-time 30 -H 'Content-Type: application/json' -d '{}' "http://localhost:8000/videos/$VIDEO_ID/claim-extractions" > /tmp/claims.json
          curl --fail "http://localhost:8000/videos/$VIDEO_ID/claims" > /tmp/latest-claims.json
          python - <<'PYCODE'
          import json
          run = json.load(open('/tmp/claims.json'))
          transcript = json.load(open('/tmp/transcript.json'))
          assert run['status'] == 'completed', run
          assert run['transcript_run_id'] == transcript['id']
          assert len(run['transcript_sha256']) == 64
          assert run == json.load(open('/tmp/latest-claims.json'))
          text = ' '.join(s['text'] for s in run['transcript_snapshot']['segments'])
          for candidate in run['candidates']:
              assert candidate['quote'] == text[candidate['char_start']:candidate['char_end']]
          PYCODE
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down -v
